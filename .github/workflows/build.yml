name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore UspApp.sln

      - name: Build
        run: dotnet build UspApp.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test UspApp.sln --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --settings coverage.runsettings
          --collect:"XPlat Code Coverage"

      - name: Coverage report
        if: always()
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet reportgenerator "-reports:**/TestResults/*/coverage.cobertura.xml" "-targetdir:coverage-report" "-reporttypes:Html;MarkdownSummaryGithub"
          Get-Content coverage-report/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test results
          path: '**/test-results.trx'
          reporter: dotnet-trx
