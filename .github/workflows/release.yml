name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Get version from tag
        id: version
        shell: pwsh
        run: echo "version=$($env:GITHUB_REF_NAME.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore UspApp.sln

      - name: Test
        run: dotnet test UspApp.sln --configuration Release --no-restore

      - name: Publish
        run: >
          dotnet publish Usp/Usp.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish
          -p:Version=${{ steps.version.outputs.version }}

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath publish.zip

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME publish.zip --title $env:GITHUB_REF_NAME --generate-notes
